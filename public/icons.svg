<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Easy Logistics — brand sprite -->

  <symbol id="easy-mark-on-dark" viewBox="0 0 64 64" fill="none">
    <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#00A4BD" stroke-width="5.5"/>
    <circle cx="32" cy="32" r="19" fill="#FFFFFF"/>
    <path d="M32 14 L49 45 H15 Z" fill="#00A4BD"/>
  </symbol>

  <symbol id="easy-mark-on-light" viewBox="0 0 64 64" fill="none">
    <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#00A4BD" stroke-width="5.5"/>
    <circle cx="32" cy="32" r="19" fill="#003D4C"/>
    <path d="M32 14 L49 45 H15 Z" fill="#FFFFFF"/>
  </symbol>

  <symbol id="easy-mark-mono-white" viewBox="0 0 64 64" fill="none">
    <defs>
      <mask id="easy-mono-white-cut">
        <rect width="64" height="64" fill="#fff"/>
        <path d="M32 14 L49 45 H15 Z" fill="#000"/>
      </mask>
    </defs>
    <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#FFFFFF" stroke-width="5.5"/>
    <circle cx="32" cy="32" r="19" fill="#FFFFFF" mask="url(#easy-mono-white-cut)"/>
  </symbol>

  <symbol id="easy-mark-mono-navy" viewBox="0 0 64 64" fill="none">
    <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#003D4C" stroke-width="5.5"/>
    <circle cx="32" cy="32" r="19" fill="#003D4C"/>
    <path d="M32 14 L49 45 H15 Z" fill="#FFFFFF"/>
  </symbol>

  <symbol id="easy-mark-mono-cyan" viewBox="0 0 64 64" fill="none">
    <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#00A4BD" stroke-width="5.5"/>
    <circle cx="32" cy="32" r="19" fill="#00A4BD"/>
    <path d="M32 14 L49 45 H15 Z" fill="#003D4C"/>
  </symbol>

  <symbol id="easy-logo-on-dark" viewBox="0 0 360 72" fill="none">
    <g transform="translate(0 4)">
      <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#00A4BD" stroke-width="5.5"/>
      <circle cx="32" cy="32" r="19" fill="#FFFFFF"/>
      <path d="M32 14 L49 45 H15 Z" fill="#00A4BD"/>
    </g>
    <g fill="#FFFFFF" font-family="Figtree, Arial Black, Helvetica, Arial, sans-serif">
      <text x="78" y="42" font-size="36" font-weight="800" letter-spacing="-1.4">easy</text>
      <text x="80" y="58" font-size="8.5" font-weight="600" letter-spacing="1.6">LOGISTICS COLOMBIA S.A.S</text>
    </g>
  </symbol>

  <symbol id="easy-logo-on-light" viewBox="0 0 360 72" fill="none">
    <g transform="translate(0 4)">
      <rect x="4" y="4" width="56" height="56" rx="2.5" stroke="#00A4BD" stroke-width="5.5"/>
      <circle cx="32" cy="32" r="19" fill="#003D4C"/>
      <path d="M32 14 L49 45 H15 Z" fill="#FFFFFF"/>
    </g>
    <g fill="#003D4C" font-family="Figtree, Arial Black, Helvetica, Arial, sans-serif">
      <text x="78" y="42" font-size="36" font-weight="800" letter-spacing="-1.4">easy</text>
      <text x="80" y="58" font-size="8.5" font-weight="600" letter-spacing="1.6">LOGISTICS COLOMBIA S.A.S</text>
    </g>
  </symbol>
</svg>
